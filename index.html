        // --- 4. KOMPONENTY APLIKACJI ---

// Helper to render judges scores with strikethrough logic (Dual Series Support)
        const renderJudgesNotes = (r1Str, r2Str) => {
            const processNotes = (str) => {
                if (!str) return Array(5).fill({ val: "-", isStruck: false });
                
                // Sprawdzamy czy ciąg zawiera gwiazdkę (tryb ręczny)
                const isManualMode = str.includes('*');
                const parts = str.trim().split(/\s+/);

                if (isManualMode) {
                    return parts.map(part => {
                        const isStruck = part.startsWith('*');
                        // Usuwamy gwiazdkę do wyświetlenia samej liczby
                        const val = isStruck ? part.substring(1) : part; 
                        return { val, isStruck };
                    });
                } else {
                    // Tryb automatyczny (skreślamy min i max - wsteczna kompatybilność)
                    const notes = parts.map(n => parseFloat(n));
                    const min = Math.min(...notes);
                    const max = Math.max(...notes);
                    let minDone = false;
                    let maxDone = false;
                    return parts.map(nStr => {
                        const val = parseFloat(nStr);
                        let isStruck = false;
                        if (val === min && !minDone) { isStruck = true; minDone = true; }
                        else if (val === max && !maxDone) { isStruck = true; maxDone = true; }
                        return { val: nStr, isStruck };
                    });
                }
            };

            const r1Data = processNotes(r1Str || "");
            const r2Data = processNotes(r2Str || "");

            return r1Data.map((note, idx) => (
                <td key={idx} className="px-1 py-2 text-center border-l border-slate-50 last:border-r">
                    <div className={`text-xs ${note.isStruck ? 'text-slate-400 line-through decoration-slate-400' : 'text-slate-800 font-bold'}`}>
                        {note.val}
                    </div>
                    {r2Str && (
                        <div className={`text-xs mt-1 ${r2Data[idx].isStruck ? 'text-slate-400 line-through decoration-slate-400' : 'text-slate-600'}`}>
                            {r2Data[idx].val}
                        </div>
                    )}
                </td>
            ));
        };

        const Dashboard = ({ contests }) => {
            const [mode, setMode] = useState('draft');

            const standings = useMemo(() => {
                const scores = {};
                Object.keys(TEAMS).forEach(team => scores[team] = 0);
                
                contests.forEach(contest => {
                    Object.keys(TEAMS).forEach(teamName => {
                        const teamMembers = getTeamMembersForContest(teamName, contest.id);
                        const memberScores = teamMembers.map(jumperName => {
                            const result = contest.results.find(r => normalizeName(r.name) === normalizeName(jumperName));
                            if (!result) return 0;
                            return mode === 'draft' ? getDraftPoints(result.rank) : getFisPoints(result.rank);
                        });
                        memberScores.sort((a, b) => b - a);
                        scores[teamName] += memberScores.slice(0, 5).reduce((a, b) => a + b, 0);
                    });
                });
                return Object.entries(scores).sort(([, a], [, b]) => b - a);
            }, [contests, mode]);

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200 gap-4">
                        <h2 className="text-xl font-bold flex items-center gap-2 text-slate-800"><Trophy className="text-yellow-500" /> Klasyfikacja Generalna</h2>
                        <div className="flex bg-slate-100 p-1 rounded-lg w-full md:w-auto">
                            <button onClick={() => setMode('draft')} className={`flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-medium ${mode === 'draft' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}>Fantasy</button>
                            <button onClick={() => setMode('fis')} className={`flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-medium ${mode === 'fis' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}>Oficjalne FIS</button>
                        </div>
                    </div>
                    
                    {/* Przywrócono overflow-x-auto dla desktopu, żeby się nie ściskało */}
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden overflow-x-auto custom-scrollbar">
                        <table className="w-full text-left min-w-[300px] md:min-w-[500px]">
                            <thead className="bg-slate-50 border-b border-slate-200">
                                <tr>
                                    {/* Desktop: px-6 py-4 | Mobile: px-2 py-2 */}
                                    <th className="px-2 py-2 md:px-6 md:py-4 font-semibold text-slate-600 whitespace-nowrap text-center md:text-left">M-ce</th>
                                    <th className="px-2 py-2 md:px-6 md:py-4 font-semibold text-slate-600">Drużyna</th>
                                    <th className="px-2 py-2 md:px-6 md:py-4 font-semibold text-slate-600 text-right">Punkty</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {standings.map(([team, points], index) => (
                                    <tr key={team} className="hover:bg-slate-50">
                                        <td className="px-2 py-2 md:px-6 md:py-4 font-bold text-slate-500 text-center md:text-left">{index + 1}.</td>
                                        <td className="px-2 py-2 md:px-6 md:py-4 font-medium flex items-center gap-2 md:gap-3 whitespace-nowrap">
                                            <div className={`shrink-0 w-6 h-6 md:w-8 md:h-8 rounded-full flex items-center justify-center text-white font-bold text-xs ${
                                                team === 'Tomasz P.' ? 'bg-green-600' : 
                                                team === 'Tomasz J.' ? 'bg-amber-600' : 
                                                team === 'Madzia' ? 'bg-pink-600' : 'bg-blue-600'
                                            }`}>{team.charAt(0)}</div>
                                            <span className="text-sm md:text-base">{team}</span>
                                        </td>
                                        <td className="px-2 py-2 md:px-6 md:py-4 font-bold text-right text-base md:text-lg">{points}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const JumperStandings = ({ contests }) => {
            const [sortMode, setSortMode] = useState('draft'); 
            const [filterMode, setFilterMode] = useState('all'); 

            const jumperScores = useMemo(() => {
                const scores = {};
                const owners = {};
                const countries = {};
                
                contests.forEach(contest => {
                    contest.results.forEach(r => {
                        const name = r.name;
                        if (!scores[name]) {
                             scores[name] = { draft: 0, fis: 0, teamDraft: 0, teamFis: 0 };
                             owners[name] = getJumperOwner(name);
                             countries[name] = r.country;
                        }
                        
                        const dPoints = getDraftPoints(r.rank);
                        const fPoints = getFisPoints(r.rank);

                        scores[name].draft += dPoints;
                        scores[name].fis += fPoints;

                        const owner = owners[name];
                        if (owner) {
                            const activeSquad = getTeamMembersForContest(owner, contest.id);
                            if (activeSquad.includes(name)) {
                                scores[name].teamDraft += dPoints;
                                scores[name].teamFis += fPoints;
                            }
                        }
                    });
                });
                
                let list = Object.entries(scores)
                    .map(([name, pts]) => ({ 
                        name, 
                        draft: pts.draft, 
                        fis: pts.fis,
                        teamDraft: pts.teamDraft,
                        teamFis: pts.teamFis,
                        owner: owners[name],
                        country: countries[name]
                    }))
                    .sort((a, b) => b[sortMode] - a[sortMode]);

                list = list.map((item, index) => ({ ...item, globalRank: index + 1 }));

                if (filterMode !== 'all') {
                    list = list.filter(j => j.owner === filterMode);
                }
                
                return list;

            }, [contests, sortMode, filterMode]);

            return (
                <div className="space-y-6 mt-8">
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 justify-between items-center">
                        <h2 className="text-xl font-bold flex items-center gap-2"><Medal className="text-orange-500" /> Indywidualnie</h2>
                        <div className="flex gap-2 text-sm flex-wrap w-full md:w-auto">
                            <select value={sortMode} onChange={(e) => setSortMode(e.target.value)} className="flex-1 md:flex-none p-2 border rounded bg-white">
                                <option value="draft">Sortuj: Draft Pkt</option>
                                <option value="fis">Sortuj: FIS Pkt</option>
                            </select>
                            <select value={filterMode} onChange={(e) => setFilterMode(e.target.value)} className="flex-1 md:flex-none p-2 border rounded bg-white">
                                <option value="all">Wszyscy Skoczkowie</option>
                                {Object.keys(TEAMS).map(team => (
                                    <option key={team} value={team}>Tylko: {team}</option>
                                ))}
                            </select>
                        </div>
                    </div>
                    
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table className="w-full text-left text-xs md:text-sm table-fixed">
                            <thead className="bg-slate-50 border-b border-slate-200">
                                <tr>
                                    {/* Kolumna 1: M-ce */}
                                    <th className="w-8 px-1 py-2 md:px-2 md:py-3 whitespace-nowrap text-[10px] md:text-sm pl-2 sticky-col bg-slate-50">#</th>
                                    
                                    {/* Kolumna 2: Zawodnik */}
                                    <th className="w-auto px-1 py-2 md:px-2 md:py-3 text-[10px] md:text-sm">Zawodnik</th>
                                    
                                    {/* Kolumna 3: Właściciel */}
                                    <th className="w-12 md:w-24 px-0.5 py-2 md:px-2 md:py-3 text-center text-[10px] md:text-sm whitespace-nowrap">Wł.</th>
                                    
                                    {/* Kolumna 4: Pkt - ZMIANA NAZWY NA "Draft Pkt." i poszerzenie w-16 */}
                                    <th className="w-16 md:w-24 px-0.5 py-2 md:px-2 md:py-3 text-right pr-2 text-[10px] md:text-sm whitespace-nowrap">
                                        {sortMode === 'draft' ? 'Draft Pkt.' : 'FIS Pkt.'}
                                    </th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {jumperScores.map((j) => (
                                    <tr key={j.name} className="hover:bg-slate-50 group">
                                        {/* Sticky Rank */}
                                        <td className="px-1 py-2 md:px-2 md:py-3 text-slate-500 font-bold pl-2 text-xs md:text-sm sticky-col bg-white group-hover:bg-slate-50 border-r border-transparent">
                                            {j.globalRank}.
                                        </td>
                                        
                                        {/* Nazwisko */}
                                        <td className="px-1 py-2 md:px-2 md:py-3 font-medium leading-tight whitespace-normal break-words">
                                            <div className="flex flex-col justify-center h-full">
                                                <div className="flex items-start">
                                                    <Flag name={j.name} country={j.country} className="mr-1 mt-0.5 shrink-0" /> 
                                                    <span>{j.name}</span>
                                                </div>
                                                
                                                {/* Rezerwowy - Pełny zapis */}
                                                {RESERVES.includes(j.name) && (
                                                    <div className="mt-1.5 ml-0 text-[9px] uppercase font-bold text-amber-700 bg-amber-50 px-2 py-1 rounded w-fit border border-amber-100 leading-snug">
                                                        <div>REZERWOWY</div>
                                                        <div className="normal-case font-semibold text-amber-800 opacity-90">
                                                            (Dla zespołu: {sortMode === 'draft' ? j.teamDraft : j.teamFis} pkt)
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </td>
                                        
                                        {/* Właściciel */}
                                        <td className="px-0.5 py-2 md:px-2 md:py-3 text-center text-[9px] md:text-xs align-middle">
                                            {j.owner ? (
                                                <span className={`px-1 py-0.5 rounded whitespace-nowrap inline-block ${
                                                    j.owner === 'Dawid' ? 'bg-blue-100 text-blue-800' :
                                                    j.owner === 'Tomasz P.' ? 'bg-green-100 text-green-800' :
                                                    j.owner === 'Tomasz J.' ? 'bg-amber-100 text-amber-800' :
                                                    'bg-pink-100 text-pink-800'
                                                }`}>
                                                    {j.owner}
                                                </span>
                                            ) : <span className="text-slate-300">-</span>}
                                        </td>
                                        
                                        {/* Punkty */}
                                        <td className="px-0.5 py-2 md:px-2 md:py-3 text-right font-bold text-blue-600 pr-2 text-xs md:text-sm align-middle">
                                            {sortMode === 'draft' ? j.draft : j.fis}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const Results = ({ contests }) => {
            const [selectedContestId, setSelectedContestId] = useState(contests[contests.length-1].id);
            const [mobileViewMode, setMobileViewMode] = useState('ranking'); 
            const [desktopTab, setDesktopTab] = useState('ranking'); 
            
            const activeContest = useMemo(() => {
                return contests.find(c => c.id === parseInt(selectedContestId)) || contests[contests.length-1];
            }, [contests, selectedContestId]);

            const viewOptions = [
                { value: 'ranking', label: 'RANKING' },
                { value: 'distance', label: 'DYSTANS' },
                { value: 'notes', label: 'NOTY' },
                { value: 'speed', label: 'PRĘDKOŚĆ' },
                { value: 'comp', label: 'WIATR/BELKA' },
            ];
            
            const juryFlags = activeContest?.jury || {};

            return (
                <div className="space-y-6">
                    {/* Header */}
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 items-center justify-between">
                        <div className="flex items-center gap-2">
                            <Flask className="text-purple-500" />
                            <h2 className="font-bold text-slate-800">Wyniki Konkursu</h2>
                        </div>
                        <div className="flex flex-col gap-2 w-full md:w-auto">
                            {/* Konkurs selector (top on mobile) */}
                            <div className="w-full md:w-auto order-1 md:order-2">
                                <label className="text-xs text-slate-500 font-semibold uppercase ml-1 md:hidden">Wybierz konkurs:</label>
                                <select 
                                    value={selectedContestId} 
                                    onChange={(e) => setSelectedContestId(Number(e.target.value))} 
                                    className="p-2 border border-slate-300 rounded-lg text-sm bg-slate-50 w-full md:min-w-[200px]"
                                >
                                    {contests.slice().reverse().map(c => <option key={c.id} value={c.id}>{c.date} - {c.location}</option>)}
                                </select>
                            </div>
						<div>
						{/* --- NOWA SEKCJA LINKÓW (Dodaj ten fragment) --- */}
                        {activeContest.links && (
                            <div className="flex flex-wrap gap-2 pt-2 border-t border-slate-100 mt-2">
                                <span className="text-xs font-bold text-slate-500 uppercase self-center mr-2">Raporty FIS:</span>
                                {activeContest.links.fis && (
                                    <a href={activeContest.links.fis} target="_blank" rel="noopener noreferrer" className="flex items-center gap-1 px-3 py-1.5 bg-slate-800 text-white text-xs rounded hover:bg-slate-700 transition-colors">
                                        <ExternalLink size={12} /> WWW FIS
                                    </a>
                                )}
                                {activeContest.links.pdf && (
                                    <a href={activeContest.links.pdf} target="_blank" rel="noopener noreferrer" className="flex items-center gap-1 px-3 py-1.5 bg-red-600 text-white text-xs rounded hover:bg-red-500 transition-colors">
                                        <ExternalLink size={12} /> Protokół PDF
                                    </a>
                                )}
                            </div>
                        )}
                        {/* ----------------------------------------------- */}
                    </div>

                            {/* View data selector (bottom on mobile) */}
                            <div className="md:hidden w-full relative order-2 md:order-1 mt-2 md:mt-0">
                                <label className="text-xs text-slate-500 font-semibold uppercase ml-1">Widok danych:</label>
                                <select 
                                    value={mobileViewMode} 
                                    onChange={(e) => setMobileViewMode(e.target.value)} 
                                    className="custom-select w-full appearance-none bg-white border border-blue-800 text-blue-900 font-bold text-sm rounded-none px-3 py-2 uppercase tracking-wide focus:outline-none focus:ring-2 focus:ring-blue-500"
                                >
                                    {viewOptions.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                </select>
                            </div>
                        </div>
                    </div>

                        {/* DESKTOP TABS */}
						<div className="bg-white md:rounded-xl shadow-sm border border-slate-200 overflow-hidden custom-scrollbar">
                        {/* DESKTOP TABS - Pokazuj tylko jeśli są wyniki */}
                        {activeContest.results.length > 0 && (
                            <div className="hidden md:flex border-b border-slate-200 bg-slate-50">
                                {[
                                    {id: 'ranking', label: 'Ranking'}, 
                                    {id: 'speed', label: 'Prędkość'}, 
                                    {id: 'judges', label: 'Noty'}, 
                                    {id: 'distance', label: 'Dystans'}, 
                                    {id: 'wind', label: 'Wiatr/Belka'}
                                ].map(tab => (
                                    <button 
                                        key={tab.id}
                                        onClick={() => setDesktopTab(tab.id)}
                                        className={`px-6 py-3 text-sm font-bold uppercase tracking-wider border-b-2 transition-colors flex items-center gap-2 ${
                                            desktopTab === tab.id 
                                                ? 'border-blue-600 text-blue-800 bg-white' 
                                                : 'border-transparent text-slate-500 hover:text-slate-700 hover:bg-slate-100'
                                        }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        )}

						{/* --- OBSŁUGA PUSTEGO KONKURSU (ODWOŁANY/OCZEKIWANIE) --- */}
                        {activeContest.results.length === 0 ? (
                            <div className="p-10 text-center bg-white">
                                <div className="inline-block p-4 rounded-full bg-amber-50 mb-4">
                                    <Info className="w-10 h-10 text-amber-500" />
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">Konkurs odwołany</h3>
                                <p className="text-slate-500 mb-6">
                                    Dzisiejszy Puchar Świata w skokach narciarskich w Ruka (FIN) został odwołany przez jury. Wiatr wiejący z prędkością do 11 m/s uniemożliwiał rywalizację. FIS rozważa ewentualną zmianę terminu zawodów, być może w Lahti (FIN), w ramach zaplanowanego tam weekendu Pucharu Świata w dniach 7 i 8 marca 2026 r..
                                </p>
                            </div>
                        ) : (
                            <>

                        {/* DESKTOP TABLE */}
                        <div className="hidden md:block overflow-x-auto">
                            <table className="w-full text-xs text-left whitespace-nowrap">
                                <thead className="bg-slate-100 text-slate-700 border-b border-slate-200">
                                    <tr>
                                        <th className="px-2 py-3 w-8 text-center font-extrabold text-slate-800">Rk</th>
                                        <th className="px-2 py-3 text-center font-bold text-slate-500">Bib</th>
                                        <th className="px-2 py-3 font-bold text-slate-800">Name</th>
                                        <th className="px-2 py-3 font-bold text-slate-800">NSA</th>
                                        
                                        {desktopTab === 'ranking' && <>
                                            <th className="px-2 py-3 text-center border-l border-slate-200">Rd. 1 Rk</th>
                                            <th className="px-2 py-3 text-center border-r border-slate-200">Rd. 2 Rk</th>
                                            
                                            <th className="px-2 py-3 text-center">Rd. 1 Dist</th>
                                            <th className="px-2 py-3 text-center">Rd. 1 Pts</th>
                                            
                                            <th className="px-2 py-3 text-center border-l border-slate-200">Rd. 2 Dist</th>
                                            <th className="px-2 py-3 text-center">Rd. 2 Pts</th>
                                            
                                            <th className="px-3 py-3 text-right font-extrabold text-blue-900 border-l border-slate-200">Total Pts</th>
                                            <th className="px-3 py-3 text-center font-bold text-slate-600 bg-slate-200">Draft</th>
                                        </>}
                                        
                                        {desktopTab === 'speed' && <>
                                            <th className="px-4 py-3 text-right font-mono">Rd. 1 km/h</th>
                                            <th className="px-4 py-3 text-right font-mono">Rd. 2 km/h</th>
                                        </>}

                                        {desktopTab === 'judges' && <>
                                             <th className="px-2 py-3 text-center border-l">Rd.</th>
                                             <th className="px-1 py-3 text-center">A <Flag country={juryFlags.A} className="ml-1 scale-75" /></th>
                                             <th className="px-1 py-3 text-center">B <Flag country={juryFlags.B} className="ml-1 scale-75" /></th>
                                             <th className="px-1 py-3 text-center">C <Flag country={juryFlags.C} className="ml-1 scale-75" /></th>
                                             <th className="px-1 py-3 text-center">D <Flag country={juryFlags.D} className="ml-1 scale-75" /></th>
                                             <th className="px-1 py-3 text-center border-r">E <Flag country={juryFlags.E} className="ml-1 scale-75" /></th>
                                             <th className="px-2 py-3 text-right font-bold">J.Pts</th>
                                        </>}

                                        {desktopTab === 'distance' && <>
                                            <th className="px-2 py-3 text-center border-l">Rd. 1 D.Pts</th>
                                            <th className="px-2 py-3 text-center border-r font-bold">Rd. 1 m</th>
                                            <th className="px-2 py-3 text-center">Rd. 2 D.Pts</th>
                                            <th className="px-2 py-3 text-center font-bold">Rd. 2 m</th>
                                        </>}

                                        {desktopTab === 'wind' && <>
                                            <th className="px-2 py-3 text-center border-l">Rd. 1 W.Pts</th>
                                            <th className="px-2 py-3 text-center">Rd. 2 W.Pts</th>
                                        </>}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 bg-white">
                                    {activeContest && activeContest.results.sort((a,b)=>a.rank-b.rank).map((r) => {
                                        const owner = getJumperOwner(r.name);
                                        const bgClass = owner ? TEAM_BG_STYLES[owner] : "hover:bg-slate-50"; 
                                        
                                        return (
                                            <tr key={`${r.rank}-${r.name}`} className={`${bgClass} transition-colors`}>
                                                <td className="px-2 py-2 font-bold text-slate-900 text-center">{r.rank}</td>
                                                <td className="px-2 py-2 text-slate-400 text-center text-[10px]">{r.bib}</td>
                                                <td className="px-2 py-2 font-bold text-slate-800">
                                                    {r.name}
                                                    {owner && <div className="text-[9px] uppercase font-bold text-blue-600 leading-none mt-0.5">{owner}</div>}
                                                </td>
                                                <td className="px-2 py-2 flex items-center gap-1"><Flag name={r.name} country={r.country} /> <span className="text-xs text-slate-500">{r.country}</span></td>

                                                {desktopTab === 'ranking' && <>
                                                    <td className="px-2 py-2 text-center text-xs text-slate-400 border-l border-slate-100">{r.r1_rank || "-"}</td>
                                                    <td className="px-2 py-2 text-center text-xs text-slate-400 border-r border-slate-100">{r.r2_rank || "-"}</td>
                                                    
                                                    <td className="px-2 py-2 text-center text-slate-600">{r.r1_dist}</td>
                                                    <td className="px-2 py-2 text-center text-slate-600">{r.r1_total}</td>

                                                    <td className="px-2 py-2 text-center text-slate-600">{r.r2_dist || "-"}</td>
                                                    <td className="px-2 py-2 text-center text-slate-600">{r.r2_total || "-"}</td>

                                                    <td className="px-3 py-2 text-right font-extrabold text-blue-900 border-l border-slate-200">{r.points}</td>
                                                    <td className="px-3 py-2 text-center font-bold text-slate-700 bg-slate-100/50">{getDraftPoints(r.rank)}</td>
                                                </>}

                                                {desktopTab === 'speed' && <>
                                                    <td className="px-4 py-2 text-right font-mono text-slate-700">{r.r1_speed || "-"}</td>
                                                    <td className="px-4 py-2 text-right font-mono text-slate-700">{r.r2_speed || "-"}</td>
                                                </>}

                                                {desktopTab === 'judges' && <>
                                                    {r.r1_judges ? (
                                                        <>
                                                            <td className="px-2 py-2 text-center text-xs border-l align-top">
                                                                <div className="font-bold text-slate-700">1</div>
                                                                {r.r2_judges && <div className="mt-1 text-slate-400 font-normal">2</div>}
                                                            </td>
                                                            {renderJudgesNotes(r.r1_judges, r.r2_judges)}
                                                            <td className="px-2 py-2 text-right text-xs align-top">
                                                                <div className="font-bold text-slate-800">{r.r1_note}</div>
                                                                {r.r2_note && <div className="mt-1 text-slate-500 font-medium">{r.r2_note}</div>}
                                                            </td>
                                                        </>
                                                    ) : <td colSpan="7" className="px-4 py-2 text-center text-xs text-slate-400 italic">Brak danych szczegółowych</td>}
                                                </>}

                                                {desktopTab === 'distance' && <>
                                                     <td className="px-2 py-2 text-center text-slate-500 border-l border-slate-100">{r.r1_dpts || "-"}</td>
                                                     <td className="px-2 py-2 text-center font-bold text-slate-800 border-r border-slate-100">{r.r1_dist}</td>
                                                     <td className="px-2 py-2 text-center text-slate-500">{r.r2_dpts || "-"}</td>
                                                     <td className="px-2 py-2 text-center font-bold text-slate-800">{r.r2_dist || "-"}</td>
                                                </>}

                                                {desktopTab === 'wind' && <>
                                                    <td className="px-2 py-2 text-center text-slate-600 border-l">{r.r1_comp}</td>
                                                    <td className="px-2 py-2 text-center text-slate-600">{r.r2_comp || "-"}</td>
                                                </>}
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>

                        {/* MOBILE COMPACT VIEW */}
                        <div className="md:hidden">
                            {/* Blue Header Row */}
                            <div className="bg-[#001489] text-white flex text-[10px] font-bold uppercase py-1 px-1">
                                <div className="w-6 text-center shrink-0">Rk</div>
                                <div className="w-6 text-center shrink-0">Bib</div>
                                <div className="flex-1 px-1">Name</div>
                                <div className="w-8 text-center shrink-0">NSA</div>
                                
                                {mobileViewMode === 'ranking' && <>
                                    <div className="w-10 text-right shrink-0">Total</div>
                                    <div className="w-8 text-center shrink-0 bg-white/20">Dft</div>
                                </>}
                                {mobileViewMode === 'distance' && <>
                                    <div className="w-12 text-right shrink-0">Rd. 1</div>
                                    <div className="w-12 text-right shrink-0">Rd. 2</div>
                                </>}
                                {mobileViewMode === 'notes' && <>
                                    <div className="w-12 text-right shrink-0">Rd. 1</div>
                                    <div className="w-12 text-right shrink-0">Rd. 2</div>
                                </>}
                                {mobileViewMode === 'speed' && <>
                                    <div className="w-12 text-right shrink-0">Rd. 1</div>
                                    <div className="w-12 text-right shrink-0">Rd. 2</div>
                                </>}
                                {mobileViewMode === 'comp' && <>
                                    <div className="w-12 text-right shrink-0">Rd. 1</div>
                                    <div className="w-12 text-right shrink-0">Rd. 2</div>
                                </>}
                            </div>

                            {/* Data Rows */}
                            <div className="divide-y divide-slate-100 bg-slate-50">
                                {activeContest && activeContest.results.sort((a,b)=>a.rank-b.rank).map((r) => {
                                    const owner = getJumperOwner(r.name);
                                    const bgClass = owner ? TEAM_BG_STYLES[owner] : "bg-white"; 

                                    const parts = r.name.split(' ');
                                    const surname = parts.length > 1 ? parts[parts.length-1].toUpperCase() : r.name.toUpperCase();
                                    const first = parts.length > 1 ? parts.slice(0, -1).join(' ') : '';
                                    const displayName = <>{surname} <span className="font-normal text-slate-600 capitalize">{first}</span></>;

                                    return (
                                        <div key={`${r.rank}-${r.name}`} className={`flex items-center py-2 px-1 text-xs border-b border-slate-100 h-12 ${bgClass}`}>
                                            <div className="w-6 text-center font-bold text-slate-800 text-sm shrink-0">{r.rank}</div>
                                            <div className="w-6 text-center text-slate-400 text-[10px] shrink-0">{r.bib}</div>
                                            
                                            <div className="flex-1 px-1 flex flex-col justify-center min-w-0">
                                                <div className="font-bold text-slate-900 truncate leading-tight">
                                                    {displayName}
                                                </div>
                                                {owner && <div className="text-[9px] uppercase font-bold text-blue-600 leading-none mt-0.5">{owner}</div>}
                                            </div>

                                            <div className="w-8 flex justify-center shrink-0">
                                                <div className="w-5 h-5 rounded-full overflow-hidden border border-slate-200 relative">
                                                    <img src={getFlagUrl(r.name, r.country)} alt={r.country} className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-8 h-auto max-w-none" />
                                                </div>
                                            </div>

                                            {mobileViewMode === 'ranking' && (
                                                <>
                                                    <div className="w-10 text-right font-bold text-sm text-slate-900 shrink-0">{r.points}</div>
                                                    <div className="w-8 text-center font-bold text-xs text-blue-700 shrink-0 bg-white/50 rounded ml-1">{getDraftPoints(r.rank)}</div>
                                                </>
                                            )}

                                            {mobileViewMode === 'distance' && (
                                                <>
                                                    <div className="w-12 text-right font-bold text-slate-900 shrink-0">{r.r1_dist}</div>
                                                    <div className="w-12 text-right font-bold text-slate-500 shrink-0">{r.r2_dist || "-"}</div>
                                                </>
                                            )}

                                            {mobileViewMode === 'notes' && (
                                                <>
                                                    <div className="w-12 text-right font-bold text-slate-900 shrink-0">{r.r1_note}</div>
                                                    <div className="w-12 text-right font-bold text-slate-500 shrink-0">{r.r2_note || "-"}</div>
                                                </>
                                            )}

                                            {mobileViewMode === 'speed' && (
                                                <>
                                                    <div className="w-12 text-right font-bold text-slate-900 shrink-0">{r.r1_speed}</div>
                                                    <div className="w-12 text-right font-bold text-slate-500 shrink-0">{r.r2_speed || "-"}</div>
                                                </>
                                            )}

                                            {mobileViewMode === 'comp' && (
                                                <>
                                                    <div className="w-12 text-right text-[10px] font-bold text-slate-900 shrink-0">{r.r1_comp}</div>
                                                    <div className="w-12 text-right text-[10px] font-bold text-slate-500 shrink-0">{r.r2_comp || "-"}</div>
                                                </>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
						</>
                    )}
                    </div>
                </div>
            );
        };

        const TeamDetails = ({ contests }) => {
            const [selectedContestId, setSelectedContestId] = useState(contests[contests.length-1].id);
            const [scoreType, setScoreType] = useState('draft'); 
            
			// --- NOWE: Mapa krajów, aby flagi działały nawet jak nie ma wyników (np. odwołany konkurs) ---
            const jumperCountries = useMemo(() => {
                const map = {};
                contests.forEach(c => {
                    c.results.forEach(r => {
                        if (r.name && r.country) {
                            map[r.name] = r.country;
                        }
                    });
                });
                return map;
            }, [contests]);
            // -------------------------------------------------------------------------------------------
			
            const activeContest = useMemo(() => {
                const found = contests.find(c => c.id === parseInt(selectedContestId));
                return found || contests[contests.length - 1];
            }, [contests, selectedContestId]);

            if (!activeContest) return <div className="p-8 text-center text-slate-500 animate-pulse">Ładowanie danych zespołów...</div>;

            return (
                <div className="space-y-6">
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 items-center justify-between">
                        <div className="flex items-center gap-2"><Calendar className="text-blue-500" /><h2 className="font-bold text-slate-800">Wyniki Zespołów</h2></div>
                        <div className="flex flex-col md:flex-row gap-2 w-full md:w-auto">
                            <select value={scoreType} onChange={(e) => setScoreType(e.target.value)} className="p-2 border border-slate-300 rounded-lg text-sm bg-slate-50 w-full md:w-auto">
                                <option value="draft">Draft Pkt (30-1)</option>
                                <option value="fis">FIS Pkt (100-1)</option>
                            </select>
                            <select value={selectedContestId} onChange={(e) => setSelectedContestId(Number(e.target.value))} className="p-2 border border-slate-300 rounded-lg text-sm bg-slate-50 w-full md:min-w-[200px]">
                                {contests.slice().reverse().map(c => <option key={c.id} value={c.id}>{c.date} - {c.location}</option>)}
                            </select>
                        </div>
                    </div>
                    {/* Wewnątrz TeamDetails -> return -> grid */}
                    {/* WARUNEK DLA ODWOŁANEGO KONKURSU (ID 5) */}
                    {activeContest.id === 5 ? (
                        <div className="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center animate-fade-in">
                            <div className="inline-block p-4 rounded-full bg-amber-50 mb-4">
                                <Info className="w-12 h-12 text-amber-500" />
                            </div>
                            <h3 className="text-2xl font-bold text-slate-800 mb-2">Konkurs Odwołany / Przełożony</h3>
                            <p className="text-slate-500 mb-8 text-lg">
                                Brak wyników punktowych dla zespołów w tym konkursie. <br />
								Dzisiejszy Puchar Świata w skokach narciarskich w Ruka (FIN) został odwołany przez jury. Wiatr wiejący z prędkością do 11 m/s uniemożliwiał rywalizację. FIS rozważa ewentualną zmianę terminu zawodów, być może w Lahti (FIN), w ramach zaplanowanego tam weekendu Pucharu Świata w dniach 7 i 8 marca 2026 r..
                            </p>

                            {/* Sekcja Nieobecni - Specjalnie dla tego widoku */}
                            <div className="max-w-md mx-auto bg-red-50 border border-red-100 rounded-xl p-6 text-left shadow-sm">
                                <div className="flex items-center gap-2 mb-4 border-b border-red-200 pb-2">
                                    <span className="relative flex h-3 w-3">
                                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                                      <span className="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                                    </span>
                                    <h4 className="font-bold text-red-800 uppercase text-sm tracking-wide">
                                        Nieobecni 28-30.11.2025 (Absencja):
                                    </h4>
                                </div>
                                <ul className="space-y-3 text-red-700 text-sm">
                                    <li className="flex items-start gap-2">
                                        <span className="font-bold text-slate-700">Stefan Kraft</span> 
                                        <span>- absencja (narodziny dziecka)</span>
                                    </li>
                                    <li className="flex items-start gap-2">
                                        <span className="font-bold text-slate-700">Artti Aigro</span> 
                                        <span>- absencja (przeziębienie)</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    ) : (
                        /* STANDARDOWY WIDOK TABEL (Dla pozostałych konkursów) */
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {Object.keys(TEAMS).map((teamName) => {
                                // --- ZMIANA: Pobieramy skład dynamicznie dla wybranego konkursu ---
                                const members = getTeamMembersForContest(teamName, activeContest.id);
                                // ------------------------------------------------------------------

                                const scores = members.map(m => {
                                    const res = activeContest.results.find(r => normalizeName(r.name) === normalizeName(m));
                                    const rank = res ? res.rank : 999;
                                    const pts = scoreType === 'draft' ? getDraftPoints(rank) : getFisPoints(rank);
                                    
                                    // --- ZMIANA: Pobieranie kraju z mapy pomocniczej jeśli brak wyniku ---
                                    const country = res ? res.country : jumperCountries[m];
                                    // ---------------------------------------------------------------------
                                    
                                    return { name: m, rank: res ? res.rank : "-", points: pts, country: country };
                                }).sort((a, b) => b.points - a.points);
                                
                                const top5 = scores.slice(0, 5);
                                const top5Sum = top5.reduce((acc, curr) => acc + curr.points, 0);

                                return (
                                    <div key={teamName} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                        <div className={`px-4 py-3 border-b border-slate-200 flex justify-between items-center ${TEAM_STYLES[teamName].replace('border-l-4', 'border-b-2')}`}>
                                            <h3 className="font-bold">{teamName}</h3>
                                            <span className="text-xs md:text-sm bg-white/80 px-2 py-1 rounded font-semibold border border-slate-200 text-slate-800">Suma (Top 5): {top5Sum}</span>
                                        </div>
                                        <div className="p-0">
                                            <table className="w-full text-sm">
                                                <thead><tr className="text-slate-500 border-b border-slate-100 bg-slate-50/50"><th className="px-3 py-2 text-left">Zawodnik</th><th className="px-2 py-2 text-center">M-ce</th><th className="px-2 py-2 text-center text-blue-600">Pkt</th></tr></thead>
                                                <tbody>
                                                    {scores.map((jumper, i) => (
                                                        <tr key={jumper.name} className={`border-b border-slate-50 last:border-0 ${i < 5 && jumper.rank !== '-' ? 'bg-slate-50/50' : ''}`}>
                                                            <td className="px-3 py-2 font-medium truncate flex flex-col sm:flex-row sm:items-center gap-1">
                                                                <div className="flex items-center">
                                                                    <Flag name={jumper.name} country={jumper.country} /> {jumper.name}
                                                                </div>
                                                                {/* --- ZMIANA: Rezerwowy tylko w Ruce i dalej --- */}
                                                                {RESERVES.includes(jumper.name) && activeContest.id >= 4 && (
                                                                    <span className="text-[9px] uppercase font-bold bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded border border-amber-200 w-fit">
                                                                        Rezerwowy
                                                                    </span>
                                                                )}
                                                            </td>
                                                            <td className="px-2 py-2 text-center font-mono text-slate-500">{jumper.rank}</td>
                                                            <td className="px-2 py-2 text-center font-bold text-blue-600">{jumper.points > 0 ? jumper.points : "-"}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                            
                                            {/* --- SEKJA NIEOBECNI DLA KONKURSU Z WYNIKAMI (ID 4 - Sobota) --- */}
                                            {teamName === "Tomasz P." && activeContest.id === 4 && (
                                                <div className="bg-red-50 border-t border-red-100 p-3 text-xs text-red-700">
                                                    <div className="font-bold mb-1 flex items-center gap-1">
                                                        <span className="w-2 h-2 rounded-full bg-red-500 inline-block"></span> 
                                                        Nieobecni (Absencja):
                                                    </div>
                                                    <ul className="space-y-1 ml-3 list-disc">
                                                        <li>
                                                            <span className="font-semibold">Stefan Kraft</span> - absencja (narodziny dziecka)
                                                        </li>
                                                        <li>
                                                            <span className="font-semibold">Artti Aigro</span> - absencja (przeziębienie)
                                                        </li>
                                                    </ul>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const DetailedResults = () => {
            return (
                <div className="flex flex-col items-center justify-center py-16 px-4 bg-white rounded-xl shadow-sm border border-slate-200 text-center animate-fade-in">
                    <div className="bg-blue-50 p-6 rounded-full mb-6">
                        <ExternalLink className="w-12 h-12 text-blue-600" />
                    </div>
                    <h2 className="text-2xl md:text-3xl font-bold text-slate-800 mb-4">Szczegółowe statystyki i analizy</h2>
                    <p className="text-slate-500 max-w-lg mb-8 text-lg">
                        Przejdź do zewnętrznego serwisu, aby zobaczyć pełne zestawienia wyników, zaawansowane wykresy oraz szczegółowe dane z sezonu 2025/26.
                    </p>
                    <a 
                        href="https://dawidek-dj.github.io/skoki-sezon-2025-26-szczegolowo/" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="inline-flex items-center gap-3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-xl transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-1"
                    >
                        <span>Otwórz stronę ze szczegółami</span>
                        <ExternalLink size={20} />
                    </a>
                    <p className="mt-6 text-xs text-slate-400">Strona otworzy się w nowej karcie</p>
                </div>
            );
        };

        const Rules = () => {
            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div className="flex items-center gap-3 mb-6">
                            <div className="bg-indigo-100 p-2 rounded-lg"><Info className="text-indigo-600" /></div>
                            <h2 className="text-xl font-bold text-slate-800">Zasady Punktacji</h2>
                        </div>
                        
                        <div className="grid md:grid-cols-2 gap-8">
                            <div>
                                <h3 className="font-bold text-slate-700 mb-3 border-b pb-2">Punktacja Draft (Ligi Prywatnej)</h3>
                                <ul className="space-y-2 text-sm text-slate-600">
                                    <li className="flex justify-between items-center bg-slate-50 p-2 rounded"><span>1. miejsce</span> <span className="font-bold text-blue-600">30 pkt</span></li>
                                    <li className="flex justify-between items-center bg-slate-50 p-2 rounded"><span>2. miejsce</span> <span className="font-bold text-blue-600">29 pkt</span></li>
                                    <li className="flex justify-between items-center bg-slate-50 p-2 rounded"><span>3. miejsce</span> <span className="font-bold text-blue-600">28 pkt</span></li>
                                    <li className="flex justify-between items-center px-2 py-1 italic text-xs text-center">...malejąco co 1 pkt...</li>
                                    <li className="flex justify-between items-center bg-slate-50 p-2 rounded"><span>30. miejsce</span> <span className="font-bold text-blue-600">1 pkt</span></li>
                                    <li className="flex justify-between items-center p-2 rounded text-slate-400"><span>> 30. miejsce</span> <span>0 pkt</span></li>
                                </ul>
                            </div>
                            
                            <div>
                                <h3 className="font-bold text-slate-700 mb-3 border-b pb-2">Zasady Zespołowe</h3>
                                <div className="space-y-4 text-sm text-slate-600">
                                    <div className="bg-orange-50 p-3 rounded-lg border border-orange-100">
                                        <p className="font-semibold text-orange-800 mb-1">Top 5 z 6</p>
                                        <p>Do wyniku drużyny w każdym konkursie wliczane są punkty 5 najlepszych zawodników z 6 posiadanych w składzie.</p>
                                    </div>
                                    <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                                        <p className="font-semibold text-slate-800 mb-1">Brak zawodnika</p>
                                        <p>Jeśli zawodnik nie wystartuje w konkursie (DNS) lub nie zakwalifikuje się (NQ), otrzymuje 0 punktów.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Updates = () => {
            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div className="flex items-center gap-3 mb-6">
                            <div className="bg-emerald-100 p-2 rounded-lg"><RefreshCw className="text-emerald-600" /></div>
                            <h2 className="text-xl font-bold text-slate-800">Dziennik Aktualizacji</h2>
                        </div>
                        
                        <div className="relative border-l-2 border-slate-200 ml-3 space-y-8">
                            {/* --- ZMIANA: slice().reverse() zapewnia kolejność od najstarszych (v1.1) do najnowszych (v1.3) --- */}
                            {APP_UPDATES.map((update, idx) => (
                                <div key={idx} className="ml-6 relative">
                                    <span className="absolute -left-[31px] top-1 w-4 h-4 rounded-full bg-white border-4 border-blue-500"></span>
                                    <div className="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4 mb-2">
                                        <span className="font-mono text-xs font-bold bg-slate-800 text-white px-2 py-0.5 rounded">{update.version}</span>
                                        <span className="text-xs text-slate-400 font-mono">{update.date}</span>
                                    </div>
                                    <p className="text-slate-600 bg-slate-50 p-3 rounded-lg border border-slate-100">{update.desc}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('standings');
            const [contests, setContests] = useState(INITIAL_CONTESTS);
            
            return (
                <div className="min-h-screen bg-slate-100 pb-12 content-fade-in">
                    <header className="bg-slate-900 text-white pb-20 pt-6 px-4 shadow-xl relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500"></div>
                        <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4 relative z-10">
                            <div className="flex items-center gap-4">
                                <div className="bg-white/10 p-3 rounded-xl backdrop-blur-sm"><Snowflake className="h-8 w-8 text-blue-300" /></div>
                                <div>
                                    <h1 className="text-2xl md:text-3xl font-bold tracking-tight">Fantasy Skoki 2025/26</h1>
                                    <p className="text-slate-400 text-sm font-medium">Manager Ligi Prywatnej</p>
                                </div>
                            </div>
                            <div className="text-right">
                                <div className="inline-block bg-slate-800/50 rounded-lg px-3 py-1 border border-slate-700 backdrop-blur-md">
                                    <span className="text-xs text-slate-400 font-mono">
                                        Ostatnia aktualizacja: <span className="text-yellow-400 font-bold">30.11 godzina 17:00</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-2 md:px-4 -mt-12 relative z-20">
                        <div className="bg-white rounded-xl shadow-lg border border-slate-200 p-1 mb-6">
                            <div className="grid grid-cols-3 gap-1 mb-1">
                                <button onClick={() => setActiveTab('standings')} className={`py-3 px-2 rounded-lg text-xs md:text-sm font-bold flex items-center justify-center gap-2 whitespace-nowrap transition-colors ${activeTab === 'standings' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}><Trophy size={16} /> <span className="hidden sm:inline">Klasyfikacja</span></button>
                                <button onClick={() => setActiveTab('teams')} className={`py-3 px-2 rounded-lg text-xs md:text-sm font-bold flex items-center justify-center gap-2 whitespace-nowrap transition-colors ${activeTab === 'teams' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}><Users size={16} /> <span className="hidden sm:inline">Zespoły</span></button>
                                <button onClick={() => setActiveTab('results')} className={`py-3 px-2 rounded-lg text-xs md:text-sm font-bold flex items-center justify-center gap-2 whitespace-nowrap transition-colors ${activeTab === 'results' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}><Table size={16} /> <span className="hidden sm:inline">Wyniki</span></button>
                            </div>
                            <div className="grid grid-cols-3 gap-1">
                                <button onClick={() => setActiveTab('detailed')} className={`py-3 px-2 rounded-lg text-xs md:text-sm font-bold flex items-center justify-center gap-2 whitespace-nowrap transition-colors ${activeTab === 'detailed' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}><ExternalLink size={16} /> <span className="hidden sm:inline">Szczegóły</span></button>
                                <button onClick={() => setActiveTab('rules')} className={`py-3 px-2 rounded-lg text-xs md:text-sm font-bold flex items-center justify-center gap-2 whitespace-nowrap transition-colors ${activeTab === 'rules' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}><Info size={16} /> <span className="hidden sm:inline">Zasady</span></button>
                                <button onClick={() => setActiveTab('updates')} className={`py-3 px-2 rounded-lg text-xs md:text-sm font-bold flex items-center justify-center gap-2 whitespace-nowrap transition-colors ${activeTab === 'updates' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}><RefreshCw size={16} /> <span className="hidden sm:inline">Aktualizacje</span></button>
                            </div>
                        </div>

                        <div className="animate-fade-in">
                            {activeTab === 'standings' && (
                                <>
                                    <Dashboard contests={contests} />
                                    <JumperStandings contests={contests} />
                                </>
                            )}
                            {activeTab === 'teams' && <TeamDetails contests={contests} /> }
                            {activeTab === 'results' && <Results contests={contests} /> }
                            {activeTab === 'detailed' && <DetailedResults /> }
                            {activeTab === 'rules' && <Rules /> }
                            {activeTab === 'updates' && <Updates /> }
                        </div>
                    </main>
                    
                    <footer className="text-center text-slate-400 mt-12 text-xs pb-8 px-4">
                        <p>Fantasy Draft Skoki Narciarskie 2025/26 • Zasady: Top 5 z 6</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
